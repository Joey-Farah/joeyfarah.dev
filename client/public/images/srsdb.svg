<svg viewBox="0 0 300 172" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sample games table from the srsdb engine">
  <rect width="300" height="172" fill="#0a0a0a" rx="6"/>

  <!-- query prompt -->
  <text x="14" y="22" font-family="monospace" font-size="8.5" fill="#06b6d4">
    <tspan fill="#475569">$ </tspan>SELECT * FROM <tspan fill="#e2e8f0">games</tspan><tspan fill="#475569">;</tspan>
  </text>

  <!-- header row -->
  <g font-family="monospace" font-size="7.5" fill="#06b6d4" opacity="0.85">
    <text x="14" y="42">char</text>
    <text x="74" y="42">vs</text>
    <text x="140" y="42">stage</text>
    <text x="196" y="42">result</text>
    <text x="262" y="42">dur</text>
  </g>
  <line x1="14" y1="48" x2="286" y2="48" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- data rows -->
  <g font-family="monospace" font-size="7.5" fill="#cbd5e1">
    <!-- row 1 -->
    <text x="14" y="64" fill="#3b82f6">Falco</text>
    <text x="74" y="64">Fox</text>
    <text x="140" y="64">BF</text>
    <text x="196" y="64" fill="#4ade80">WIN</text>
    <text x="262" y="64" fill="#64748b">3:21</text>
    <!-- row 2 -->
    <text x="14" y="82" fill="#3b82f6">Falco</text>
    <text x="74" y="82">Marth</text>
    <text x="140" y="82">YS</text>
    <text x="196" y="82" fill="#f87171">LOSS</text>
    <text x="262" y="82" fill="#64748b">4:05</text>
    <!-- row 3 -->
    <text x="14" y="100" fill="#3b82f6">Falco</text>
    <text x="74" y="100">Sheik</text>
    <text x="140" y="100">FD</text>
    <text x="196" y="100" fill="#4ade80">WIN</text>
    <text x="262" y="100" fill="#64748b">5:18</text>
    <!-- row 4 -->
    <text x="14" y="118" fill="#3b82f6">Falco</text>
    <text x="74" y="118">Puff</text>
    <text x="140" y="118">DL</text>
    <text x="196" y="118" fill="#4ade80">WIN</text>
    <text x="262" y="118" fill="#64748b">6:32</text>
    <!-- row 5 -->
    <text x="14" y="136" fill="#3b82f6">Falco</text>
    <text x="74" y="136">Peach</text>
    <text x="140" y="136">FoD</text>
    <text x="196" y="136" fill="#f87171">LOSS</text>
    <text x="262" y="136" fill="#64748b">4:47</text>
  </g>

  <line x1="14" y1="146" x2="286" y2="146" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.15"/>
  <text x="14" y="160" font-family="monospace" font-size="7" fill="#475569">-- 5 of ~200k rows · B+tree index</text>
  <text x="286" y="160" font-family="monospace" font-size="7" fill="#475569" text-anchor="end">rslp</text>
</svg>
